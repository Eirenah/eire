<script>(function(){
var root=document.getElementById('eal-whisky');if(!root)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function link(v){v=String(v);var m=v.match(/https?:\/\/\S+/);if(!m)return esc(v);var u=m[0];return esc(v.slice(0,m.index))+'<a href="'+esc(u)+'" rel="noopener" target="_blank">'+esc(u.replace(/^https?:\/\//,'').slice(0,60))+'</a>'+esc(v.slice(m.index+u.length))}
var pub=JSON.parse(document.getElementById('ew-public').textContent);
var grid=document.getElementById('ew-grid');
grid.innerHTML=pub.map(function(p){
 var f=p.f.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>'}).join('');
 var src=Object.keys(p.src||{}).map(function(k){return '<li>'+esc(k)+': '+link(p.src[k])+'</li>'}).join('');
 var set=p.set?'<div class="ew-set"><strong>Offered as one full set (Trees 1–7, 7 bottles).</strong>'+(p.trees?'<ul>'+p.trees.map(function(t){return '<li>Tree '+t.tree+' — '+esc(t.abv)+', bottle '+esc(t.bottle)+'</li>'}).join('')+'</ul>':'')+'</div>':'';
 return '<article class="ew-card" id="ew-'+esc(p.id)+'">'+(p.img?'<img loading="lazy" src="'+esc(p.img)+'" alt="'+esc(p.t)+'">':'')+
 (p.imgs?'<div class="ew-thumbs">'+p.imgs.map(function(s,i){return '<img loading="lazy" src="'+esc(s)+'" alt="Tree bottle photo '+(i+1)+'">'}).join('')+'</div>':'')+'<div class="ew-body"><h3>'+esc(p.t)+'</h3><div class="ew-badges"><span class="ew-badge">'+(p.listing?esc(p.listing):p.n+(p.n==1?' bottle':' bottles'))+'</span></div>'+
 '<dl>'+f+'</dl><p class="ew-tl">'+esc(p.tl)+'</p>'+(p.desc?'<p class="ew-desc">'+esc(p.desc)+'</p>':'')+set+
 (p.rec?'<p class="ew-rec"><strong>Collector note:</strong> '+esc(p.rec)+'</p>':'')+(src?'<details class="ew-src"><summary>Sources</summary><ul>'+src+'</ul></details>':'')+'</div></article>'}).join('');
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(pw){
 var e=JSON.parse(document.getElementById('ew-enc').textContent);
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
 return JSON.parse(new TextDecoder().decode(pt));
}
function eur(v){return v==null||v===''?'неизвестно':'€'+Number(v).toLocaleString('en-IE')}
function pct(x){return (x>0?'+':'')+(x*100).toFixed(0)+'%'}
function render(d){
 var t=d.totals,A=d.totalsA,h='',Y=t.forecast_years;
 function tbl(head,rows){return '<div class="ew-tablewrap"><table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i>0&&/^[€+\-−0-9]/.test(String(c))?' class="num"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 h+='<div class="ew-kpi"><div>Bottles in the collection<b>'+t.stock_bottles+'</b></div><div>Listings (Kylebeg set = 1)<b>'+t.stock_listings+'</b></div><div>Purchase, real prices<b>'+eur(t.stock_purchase_total_eur)+'</b></div><div>Purchase, real + estimated<b>'+eur(t.stock_purchase_real_plus_estimated_eur)+'</b></div><div>Market value (collection)<b>'+eur(t.mv_stock_eur)+'</b></div><div>Market value, all '+(t.stock_bottles+t.removed_bottles)+' bottles<b>'+eur(t.mv_all_eur)+'</b></div><div>Base case 2036 (collection)<b>'+eur(t.forecast_stock.base[10])+'</b></div></div>';
 h+='<h3>Valuation, '+esc(t.market_checked)+'</h3>'+tbl(['','Bottles','Purchase','Market value (hammer)','Difference'],[
  ['In the collection (on photos) — real prices only ('+t.stock_bottles_unknown_price+' bottles without)',t.stock_bottles,eur(t.stock_purchase_total_eur),eur(t.mv_stock_eur),eur(Math.round(t.mv_stock_eur-t.stock_purchase_total_eur))],
  ['In the collection — real + estimated prices',t.stock_bottles,eur(t.stock_purchase_real_plus_estimated_eur),eur(t.mv_stock_eur),eur(Math.round(t.mv_stock_eur-t.stock_purchase_real_plus_estimated_eur))],
  ['Bought, not on photos',t.removed_bottles,eur(t.removed_purchase_eur),eur(t.mv_not_in_photos_eur),eur(Math.round(t.mv_not_in_photos_eur-t.removed_purchase_eur))],
  ['All bottles',t.stock_bottles+t.removed_bottles,eur(t.all_purchases_eur),eur(t.mv_all_eur),eur(Math.round(t.mv_all_eur-t.all_purchases_eur))]]);
 h+='<p>Market value = median completed auction hammer price (excl. buyer fees) per bottle: 2026 sales first, 2025 if none; exact release first, otherwise “estimate by comparable”; Redbreast 15 = retailer listing. If sold at Irish Whiskey Auctions, the seller would receive ≈'+eur(t.mv_stock_net_to_seller_eur)+' for the collection (−5% commission, −€4 listing, VAT on fees); a buyer would pay ≈'+eur(t.mv_stock_buyer_cost_eur)+' (+10% + VAT). All purchases '+t.all_purchases_bottles+' bottles: '+esc(t.all_purchases_note)+'; '+t.stock_bottles_unknown_price+' bottles on photos have no purchase line. '+esc(t.fx)+'.</p>';
 var R=t.forecast_rates,idx=[0,1,2,5,10];
 h+='<h3>10-year projection to 2036 (not a guarantee)</h3><p>Annual nominal rates per segment. “Rare” = market value ≥ €250 per bottle and the Kylebeg set ('+t.segments_stock_bottles.rare+' bottles, '+eur(t.segments_stock.rare)+'); “standard” = below €250 ('+t.segments_stock_bottles.standard+' bottles, '+eur(t.segments_stock.standard)+').</p>';
 h+=tbl(['Scenario','Rare / yr','Standard / yr'].concat(idx.map(function(i){return String(Y[i])})),['conservative','base','optimistic'].map(function(s){return [s,pct(R[s].rare),pct(R[s].standard)].concat(idx.map(function(i){return eur(t.forecast_stock[s][i])}))}));
 h+='<p>All '+(t.stock_bottles+t.removed_bottles)+' bottles in 2036: conservative '+eur(t.forecast_all.conservative[10])+' · base '+eur(t.forecast_all.base[10])+' · optimistic '+eur(t.forecast_all.optimistic[10])+'.</p>';
 h+='<p><b>Why these rates.</b> Conservative = the recent decline continues but more slowly: Irish index −14.45% over 3 years (≈−5%/yr); whisky −19.6% over 5 years and −10.9% in 2025 (Knight Frank). Base = flat to slightly up: the Irish index is +1.75% over the last 12 months but −7.17% since Jan 2019 in total; standard releases are still produced, so no real growth is assumed. Optimistic = a partial return to the long-run trend: whisky +111.9% over 10 years (≈+7.8%/yr), but that index is Scotch-led and Irish whiskey never had Scotch’s boom (Whiskystats), so it is capped at +6% (rare) and +3% (standard). <b>Caveats:</b> auction values are hammer prices; selling costs ≈6–8% at IWA (more at other houses, up to ~10–15% with fees and VAT), plus shipping and insurance; storage (upright, dark, stable temperature) and boxes/condition affect price; liquidity: many bottles of the same release sold at once can push prices down; single sales can be outliers; the rates are nominal, before inflation. This is a projection, not a guarantee.</p>';
 h+='<h4>Sources</h4><ul>'+d.sources.map(function(s){return '<li>'+esc(s.t)+' — '+link(s.u)+'</li>'}).join('')+'</ul>';
 var ES=d.groups.filter(function(g){return g.estimated_purchase});
 h+='<h3>Estimated purchase prices (not real prices) — '+t.stock_bottles_unknown_price+' bottles, '+eur(t.stock_purchase_estimated_eur)+'</h3>'+tbl(['Group','Bottles','Estimated €/btl','Total','Method','Source'],ES.map(function(g){var e=g.estimated_purchase;return [esc(g.t),e.n,eur(e.eur_each)+' (est.)',eur(e.total),esc(e.method),e.url?link(e.url):'Aivars’ own prices (PDF)']}));
 h+='<h3>Open questions ('+d.disputed.length+')</h3>'+tbl(['Group','Type','Case'],d.disputed.map(function(x){return [esc(x.group),esc(x.kind),esc(x.case)]}));
 h+='<h3>Collection by bottle group</h3>';
 h+=tbl(['Group','Bottles (A)','Bottles: PDF row · € · date','Purchase','Market €/btl','Market value','Basis','Market evidence'],d.groups.map(function(g){
  var su=g.stock_units.map(function(u){return '#'+esc(u.pdf_row)+' · '+eur(u.unit_eur)+' · '+esc(u.date)}).join('<br>');
  var mk=(g.market_points||[]).map(function(m){return esc(m.date)+' '+esc(m.cur)+' '+esc(m.price)+(m.cur!='EUR'?' (≈€'+m.eur+')':'')+' '+link(m.url)+(m.note?' — '+esc(m.note):'')}).join('<br>');
