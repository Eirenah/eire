<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner — Whisky Collection (locked)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.owner-lock{max-width:420px;margin:80px auto;padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:14px;text-align:center}
.owner-lock input{width:100%;padding:12px;margin:12px 0;border-radius:8px;border:1px solid var(--border);background:#1a1210;color:var(--cream);font:inherit}
.owner-lock button{background:var(--gold);color:#1a1008;border:0;padding:12px 22px;border-radius:8px;font-weight:700;cursor:pointer}
.owner-lock .err{color:var(--danger);min-height:1.2em}
.owner-bar{position:sticky;top:0;z-index:30;background:rgba(20,15,10,.95);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.owner-bar .pill{background:rgba(45,90,61,.5);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:.85rem}
.edit-panel{background:rgba(26,58,42,.35);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px}
.edit-panel label{display:block;font-size:.8rem;color:var(--muted);margin-top:8px}
.edit-panel input,.edit-panel select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:#1a1210;color:var(--cream)}
.ask-lg{font-family:var(--serif);font-size:1.6rem;color:var(--gold2)}
.bought-lg{color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="lock" class="owner-lock">
  <h1 style="font-family:var(--serif);color:var(--gold2);margin:0 0 8px">Owner view</h1>
  <p style="color:var(--muted)">Purchase prices &amp; auction data are AES-encrypted. Enter password to unlock.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button id="unlock">Unlock</button>
  <p class="err" id="err"></p>
  <p style="font-size:.8rem;color:var(--muted);margin-top:18px"><a href="index.html">← Public catalog</a></p>
</div>
<div id="app" class="hidden">
  <div class="owner-bar">
    <strong style="color:var(--gold)">Owner unlocked</strong>
    <span class="pill" id="o-stats"></span>
    <button id="lock-btn" style="margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--cream);padding:8px 12px;border-radius:8px;cursor:pointer">Lock</button>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search…">
    <select id="sort"><option value="order">Sort: Original photo order</option><option value="ask">Sort: Ask high→low</option><option value="buy">Sort: Purchase high→low</option><option value="name">Sort: Name</option></select>
    <span id="result-count" style="color:var(--muted)"></span>
  </div>
  <main><div class="grid" id="grid"></div></main>
  <div class="modal" id="modal"><div class="modal-card">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-grid">
      <div class="gallery"><img class="main" id="m-main" alt=""><div class="thumbs" id="m-thumbs"></div></div>
      <div class="detail">
        <div class="brand" id="m-brand"></div>
        <h2 id="m-name"></h2>
        <div id="m-price"></div>
        <div class="edit-panel" id="edit-panel">
          <strong style="color:var(--gold)">Editable price panel</strong>
          <p style="font-size:.8rem;color:var(--muted);margin:6px 0">Edits here are session-only. To persist, update <code>data/prices.csv</code> and rebuild.</p>
          <label>Market-based ask (€), before margin floor</label><input id="e-ask" type="number" step="1">
          <label>Public price (€)</label><input id="e-pub" type="number" step="1">
          <label>Show on public site</label>
          <select id="e-show"><option value="yes">yes</option><option value="no">no (Price on request)</option></select>
          <label>Purchase (€)</label><input id="e-buy" type="number" step="1">
          <label>Purchase date</label><input id="e-date" type="text" placeholder="YYYY-MM">
          <button id="e-apply" style="margin-top:12px;background:var(--gold);color:#1a1008;border:0;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;width:100%">Apply in this session</button>
          <pre id="e-csv" style="font-size:.7rem;color:var(--muted);white-space:pre-wrap;margin-top:10px"></pre>
        </div>
        <div class="market-block" id="m-market"></div>
        <dl id="m-dl"></dl>
        <h3 style="font-family:var(--serif);color:var(--gold)">History</h3><p id="m-history"></p>
        <h3 style="font-family:var(--serif);color:var(--gold)">Why valuable</h3><p id="m-why"></p>
      </div>
    </div>
  </div></div>
</div>

let DATA=null, currentId=null;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(password, salt, iter){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
}
async function unlock(){
  $('#err').textContent='';
  try{
    const key=await deriveKey($('#pw').value, b64(ENC.salt), ENC.iter);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.nonce)}, key, b64(ENC.ciphertext));
    DATA=JSON.parse(new TextDecoder().decode(pt));
    sessionStorage.setItem('whisky_owner_ok','1');
    $('#lock').classList.add('hidden');
    $('#app').classList.remove('hidden');
    render();
  }catch(e){ $('#err').textContent='Wrong password or corrupt payload.'; }
}
function render(){
  const q=($('#search').value||'').toLowerCase();
  const sort=$('#sort').value;
  let list=DATA.items.filter(it=>{
    if(!q) return true;
    return `${it.name} ${it.brand} ${it.cask||''}`.toLowerCase().includes(q);
  });
  if(sort==='ask') list.sort((a,b)=>(b.recommended_ask_eur??-1)-(a.recommended_ask_eur??-1));
  if(sort==='buy') list.sort((a,b)=>(b.purchase_price_eur??-1)-(a.purchase_price_eur??-1));
  if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  $('#o-stats').textContent = `${DATA.stats.unique_bottles} bottles · purchase €${(DATA.stats.total_purchase_value_eur||0).toLocaleString('en-IE')} · ask €${(DATA.stats.est_market_value_eur||0).toLocaleString('en-IE')}`;
  $('#result-count').textContent=list.length+' shown';
  $('#grid').innerHTML=list.map(it=>{
    const img=it.photos?.[0]?.thumb||'';
    const ask=it.recommended_ask_eur!=null?`Ask €${it.recommended_ask_eur}`:'Ask —';
    const badge=it.price_floor_lifted?'<div class="bought">↑ Margin floor: market below target</div>':it.price_floor_only?'<div class="bought">Margin floor only · no recent market quote</div>':'';
    const buy=it.purchase_price_eur!=null?`bought €${it.purchase_price_eur}`:'';
    return `<article class="card" data-id="${it.id}"><div class="imgwrap">${img?`<img src="${img}" alt="">`:''}</div>
      <div class="body"><div class="brand">${esc(it.brand||'')}</div><h3>${esc(it.name)}</h3>
      <div class="price"><span class="ask">${ask}</span><span class="bought">${buy}</span></div>${badge}</div></article>`;
  }).join('');
  $$('#grid .card').forEach(c=>c.onclick=()=>openModal(c.dataset.id));
}
function openModal(id){
  const it=DATA.items.find(x=>x.id===id); if(!it) return;
  currentId=id;
  const photos=it.photos||[];
  $('#m-brand').textContent=it.brand||'';
  $('#m-name').textContent=it.name;
  $('#m-main').src=photos[0]?.full||photos[0]?.thumb||'';
  $('#m-thumbs').innerHTML=photos.map((p,i)=>`<img src="${p.thumb}" data-full="${p.full}" class="${i===0?'active':''}">`).join('');
  $$('#m-thumbs img').forEach(img=>img.onclick=()=>{ $('#m-main').src=img.dataset.full; $$('#m-thumbs img').forEach(x=>x.classList.remove('active')); img.classList.add('active'); });
  let ph='';
  if(it.recommended_ask_eur!=null) ph+=`<div class="ask-lg">Recommended ask €${it.recommended_ask_eur}</div>`;
  if(it.purchase_price_eur!=null) ph+=`<div class="bought-lg">Purchase €${it.purchase_price_eur}${it.purchase_date?` · ${it.purchase_date}`:''}</div>`;
  if(it.price_floor_lifted) ph+=`<div class="bought-lg">↑ Lifted by ${it.min_margin_pct}% margin floor: market €${it.market_based_ask_eur}; minimum target €${it.margin_floor_eur}</div>`;
  if(it.price_floor_only) ph+='<div class="bought-lg">Margin floor only; no recent verified market ask</div>';
  $('#m-price').innerHTML=ph||'<span class="tbd">No prices</span>';
  // market
  let auc='';
  const L=it.auction_low_eur,H=it.auction_high_eur;
  if(L!=null||H!=null){ const r=(L!=null&&H!=null&&L!==H)?`€${L}–€${H}`:`€${L??H}`; auc+=`<div><strong>Auction (hammer excl. fees):</strong> ${r}</div>`; if(it.auction_dates) auc+=`<div class="muted">${esc(it.auction_dates)}</div>`; }
  if(it.retail_eur!=null) auc+=`<div><strong>Retail ref:</strong> €${it.retail_eur}</div>`;
  if(it.market_rationale) auc+=`<div class="muted">${esc(it.market_rationale)}</div>`;
  (it.auction_sources||[]).forEach(u=>{ auc+=`<div class="sources"><a href="${u}" target="_blank" rel="noopener">${esc(u)}</a></div>`; });
  if(it.market_data_status) auc+=`<div class="muted">${esc(it.market_data_status)}</div>`;
  if((it.market_data_points||[]).length){
    auc+='<h4>Recent evidence · May–Nov 2026</h4>';
    for(const point of it.market_data_points){
      const raw=point.price!=null?`${point.currency||'EUR'} ${point.price} · `:'';
      auc+=`<div class="sources"><strong>${esc(point.date)}</strong> · ${esc(point.kind.replace(/_/g,' '))}<br>${esc(raw)}EUR ${esc(point.price_eur)}<br><a href="${esc(point.url)}" target="_blank" rel="noopener">${esc(point.url)}</a>${point.note?'<br>'+esc(point.note):''}</div>`;
    }
  }
  $('#m-market').innerHTML=auc||'<div class="muted">No recent data</div>';
  const rows=[['Unit ID',it.id],['Photo',it.photo_filename],['Bottle / serial',it.unit_bottle_number],['Unit cask',it.unit_cask_number],['Acquisition status',it.purchase_assignment_note],['Region',it.region],['Age',it.age?it.age+' years':null],['ABV',it.abv!=null?it.abv+'%':null],['Volume',it.volume_ml?it.volume_ml+' ml':null],['Cask',it.cask]].filter(([,v])=>v!=null&&v!=='');
  $('#m-dl').innerHTML=rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(String(v))}</dd>`).join('');
  $('#m-history').textContent=it.history||'';
  $('#m-why').textContent=it.why_valuable||'';
  $('#e-ask').value=it.market_based_ask_eur??'';
  $('#e-pub').value=it.public_price_eur??it.recommended_ask_eur??'';
  $('#e-show').value=it.show_price===false?'no':'yes';
  $('#e-buy').value=it.purchase_price_eur??'';
  $('#e-date').value=it.purchase_date||'';
  $('#e-csv').textContent='';
  $('#modal').classList.add('open');
}
function applyEdit(){
  const it=DATA.items.find(x=>x.id===currentId); if(!it) return;
  const ask=$('#e-ask').value===''?null:Number($('#e-ask').value);
  const pub=$('#e-pub').value===''?null:Number($('#e-pub').value);
  const buy=$('#e-buy').value===''?null:Number($('#e-buy').value);
  it.market_based_ask_eur=ask; it.purchase_price_eur=buy;
  const floor=buy==null?null:Math.ceil((buy*(1+(DATA.min_margin_pct??25)/100)-1e-8)/10)*10;
  it.margin_floor_eur=floor; it.price_floor_lifted=floor!=null&&ask!=null&&ask<floor; it.price_floor_only=floor!=null&&ask==null;
  it.recommended_ask_eur=ask==null?floor:floor==null?ask:Math.max(ask,floor); it.public_price_eur=it.recommended_ask_eur;
  it.purchase_date=$('#e-date').value||null;
  it.show_price=$('#e-show').value==='yes';
  const line=[it.id,it.photo_filename,it.expression_id,it.name,buy??'',it.purchase_date||'',ask??'',pub??'',it.show_price?'yes':'no'].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',');
  openModal(currentId); render();
  $('#e-csv').textContent='CSV row to paste into data/prices.csv:\n'+line+'\nThen: python3 scripts/rebuild_public_site.py';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#unlock').onclick=unlock;
$('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); });
$('#search').oninput=render; $('#sort').onchange=render;
$('#modal-close').onclick=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); };
$('#e-apply').onclick=applyEdit;
$('#lock-btn').onclick=()=>{ sessionStorage.removeItem('whisky_owner_ok'); location.reload(); };
</script>
</body></html>
